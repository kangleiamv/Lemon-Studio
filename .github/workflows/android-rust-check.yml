name: Android Rust compatibility

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-rust-check.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-rust-check.yml'

jobs:
  android-rust-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found under ANDROID_HOME."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config
      - name: Configure Android NDK toolchain
        shell: bash
        run: |
          NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          if [[ -z "$NDK_ROOT" || ! -d "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" ]]; then
            echo "::error::Android NDK was not found on this runner."
            env | sort | grep -E 'ANDROID_(NDK|HOME|SDK)' || true
            exit 1
          fi
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android26-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android26-clang++"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Check reusable Rust crates for Android ARM64
        run: cargo check --target aarch64-linux-android -p os-model -p os-dsp -p os-engine
