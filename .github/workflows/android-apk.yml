name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Android NDK C/C++ compilers
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build Rust Android library
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p lemon-android

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Lemon-Studio-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lemon-Studio-Android-debug
          path: dist/Lemon-Studio-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
