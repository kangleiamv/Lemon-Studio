name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/android-rust-check.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found under ANDROID_HOME."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Android NDK C/C++ compilers
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android29-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android29-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android29-clang"
            echo "CXX_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android29-clang++"
            echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build original Lemon Studio Android library
        run: |
          cargo ndk -t arm64-v8a --platform 29 -o android/app/src/main/jniLibs build --release -p os-app --lib
          cargo ndk -t x86_64 --platform 29 -o android/app/src/main/jniLibs build --release -p os-app --lib

      - name: Package Android C++ runtime
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$RUNTIME"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$RUNTIME" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          X86_RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so"
          test -f "$X86_RUNTIME"
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp "$X86_RUNTIME" android/app/src/main/jniLibs/x86_64/libc++_shared.so

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Lemon-Studio-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lemon-Studio-Android-debug
          path: dist/Lemon-Studio-Android-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lemon-Studio-Android-debug
          path: dist

      - name: Boot Android emulator and launch Lemon Studio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r dist/Lemon-Studio-Android-debug.apk
            adb logcat -c
            adb shell monkey -p org.lemonstudio.android 1
            sleep 20
            adb logcat -d -v threadtime > lemon-studio-logcat.txt
            if ! adb shell pidof org.lemonstudio.android; then
              cat lemon-studio-logcat.txt
              echo "::error::Lemon Studio process exited after launch."
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|dlopen failed" lemon-studio-logcat.txt; then
              cat lemon-studio-logcat.txt
              echo "::error::Android runtime crash detected."
              exit 1
            fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lemon-Studio-Android-logcat
          path: lemon-studio-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
